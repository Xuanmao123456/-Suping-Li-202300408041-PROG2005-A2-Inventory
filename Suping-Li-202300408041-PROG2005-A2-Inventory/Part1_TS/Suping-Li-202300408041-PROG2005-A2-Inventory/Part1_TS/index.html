<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Inventory Management System (Part1)</title>
    <link rel="stylesheet" href="styles.css">
    <!-- Import compiled JavaScript file, ensure TS is compiled first -->
    <script src="app.js" defer></script>
</head>
<body>
<div class="container">
    <h1>Inventory Management System</h1>

    <!-- Item Addition Form: Collect new item information -->
    <section class="add-item-form">
        <h2>Add New Item</h2>
        <form id="add-item-form">
            <div class="form-group">
                <label for="item-id">Item ID (Unique):</label>
                <input type="text" id="item-id" required placeholder="e.g. ITEM004">
                <span class="error-message" id="id-error"></span>
            </div>
            <div class="form-group">
                <label for="item-name">Item Name:</label>
                <input type="text" id="item-name" required placeholder="e.g. Monitor">
                <span class="error-message" id="name-error"></span>
            </div>
            <div class="form-group">
                <label for="item-price">Price ($):</label>
                <input type="number" id="item-price" min="0" step="0.01" required placeholder="e.g. 199.99">
                <span class="error-message" id="price-error"></span>
            </div>
            <div class="form-group">
                <label for="item-quantity">Quantity:</label>
                <input type="number" id="item-quantity" min="0" required placeholder="e.g. 20">
                <span class="error-message" id="quantity-error"></span>
            </div>
            <div class="form-group">
                <label for="item-popular">Is Popular:</label>
                <input type="checkbox" id="item-popular">
            </div>
            <button type="submit" class="btn">Add Item</button>
        </form>
    </section>

    <!-- Item List Display Area: Show all inventory items -->
    <section class="inventory-list">
        <h2>All Items</h2>
        <div id="items-container"></div>
    </section>
</div>
</body>
</html>
